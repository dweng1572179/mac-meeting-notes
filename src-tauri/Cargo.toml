[package]
name = "meeting-notes"
version = "0.1.0"
description = "Meeting Notes"
authors = ["Darryl Weng"]
edition = "2021"
rust-version = "1.77"
build = "build.rs"

[lib]
name = "meeting_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2"

[dependencies]
chrono = "0.4"
keyring = "3"
reqwest = { version = "0.13", features = ["json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v4"] }
