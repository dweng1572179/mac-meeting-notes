[package]
name = "meeting-notes"
version = "0.5.0"
description = "Meeting Notes"
authors = ["Darryl Weng"]
edition = "2021"
rust-version = "1.77"
build = "build.rs"

[lib]
name = "meeting_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4"
keyring = { version = "3" }
reqwest = { version = "0.13", features = ["json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
objc2 = "0.6"
objc2-audio-toolbox = { version = "0.3.2", default-features = false, features = ["AudioConverter", "AudioFile", "ExtendedAudioFile", "objc2-core-audio-types", "objc2-core-foundation", "std"] }
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["AudioHardware", "objc2", "objc2-core-audio-types", "objc2-foundation", "std"] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["CoreAudioBaseTypes", "objc2", "std"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["CFDictionary", "CFString", "CFURL", "objc2", "std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSDictionary", "NSObject", "NSString", "NSUUID", "std"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Power", "Win32_System_Threading", "Win32_System_Performance"] }
