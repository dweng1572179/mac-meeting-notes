name: Release

on:
  push:
    tags: ['v0.2.7']

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: rustup target add aarch64-apple-darwin
      - run: npm test -- --run
      - run: npm run check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: npm run tauri build -- --target aarch64-apple-darwin --bundles app
      - run: node scripts/check-package-dmg.mjs "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Meeting Notes.app"
      - run: node scripts/package-dmg.mjs "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Meeting Notes.app" Meeting-Notes.dmg
      - name: Verify packaged app signature
        run: |
          mount_dir=$(mktemp -d)
          entitlements=$(mktemp)
          trap 'hdiutil detach "$mount_dir"; rm -f "$entitlements"' EXIT
          hdiutil attach Meeting-Notes.dmg -readonly -nobrowse -mountpoint "$mount_dir"
          codesign --verify --deep --strict --verbose=4 "$mount_dir/Meeting Notes.app"
          codesign -d --xml --entitlements "$entitlements" "$mount_dir/Meeting Notes.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.device.audio-input' "$entitlements")" = true
      - run: >-
          gh release create "$GITHUB_REF_NAME" Meeting-Notes.dmg
          --title "Meeting Notes $GITHUB_REF_NAME"
          --notes-file docs/releases/v0.2.7.md
        env:
          GH_TOKEN: ${{ github.token }}
