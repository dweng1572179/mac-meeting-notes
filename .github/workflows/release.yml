name: Release

on:
  push:
    tags: ['v0.2.3']

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: rustup target add aarch64-apple-darwin
      - run: npm test -- --run
      - run: npm run check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: npm run tauri build -- --target aarch64-apple-darwin
      - name: Verify packaged app signature
        run: |
          mount_dir=$(mktemp -d)
          trap 'hdiutil detach "$mount_dir"' EXIT
          hdiutil attach "src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/Meeting Notes_0.2.3_aarch64.dmg" -readonly -nobrowse -mountpoint "$mount_dir"
          codesign --verify --deep --strict --verbose=4 "$mount_dir/Meeting Notes.app"
      - run: mv "src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/Meeting Notes_0.2.3_aarch64.dmg" Meeting-Notes.dmg
      - run: >-
          gh release create "$GITHUB_REF_NAME" Meeting-Notes.dmg
          --title "Meeting Notes $GITHUB_REF_NAME"
          --notes "Fixes AAC startup failures by selecting a bit rate supported by the Mac's native converter. Only actual system-audio permission denials now show privacy-setting guidance. Ad-hoc signed beta: replace any existing Meeting Notes app rather than keeping both."
        env:
          GH_TOKEN: ${{ github.token }}
